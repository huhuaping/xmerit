on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # 优化 1: 强制 renv 使用 RSPM 二进制包仓库，避免 Linux 上的源码编译耗时
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/jammy/latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 优化 2: 使用专门针对 renv 的 setup-renv 替代 setup-r-dependencies
      # 它会自动处理 R、Pandoc 以及 renv 库的自动缓存（通常比手动配置更可靠）
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2 # 遇到环境问题时可通过修改此数字强制刷新缓存

      - name: Set deployment variables
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "DEPLOY_DIR=dev" >> $GITHUB_ENV
            echo "PKG_URL=https://huhuaping.github.io/xmerit/dev/" >> $GITHUB_ENV
          else
            echo "DEPLOY_DIR=." >> $GITHUB_ENV
            echo "PKG_URL=https://huhuaping.github.io/xmerit/" >> $GITHUB_ENV
          fi

      - name: Build site
        shell: Rscript {0}
        run: |
          # 优化 3: 显式检查并确保 pkgdown 在 renv 环境中可用
          if (!requireNamespace("pkgdown", quietly = TRUE)) install.packages("pkgdown")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, override = list(url = '${{ env.PKG_URL }}'))

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          target-folder: ${{ env.DEPLOY_DIR }}
          clean: false