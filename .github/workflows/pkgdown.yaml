# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# - main: deploy docs/ to gh-pages root (production site)
# - dev:  deploy docs/ to gh-pages/dev/ (preview at .../xmerit/dev/)
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, override = list(url = 'https://huhuaping.github.io/xmerit/dev/'))"
          else
            Rscript -e "pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)"
          fi

      - name: Deploy to GitHub Pages (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Deploy to GitHub Pages (dev preview)
        if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: dev
          branch: gh-pages
          keep_files: true
